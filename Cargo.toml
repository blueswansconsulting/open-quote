[package]
name = "open-quote"
version = "0.1.0"
edition = "2021"
description = "Free, self-hostable quote PDF maker for one-person trade businesses"
license = "AGPL-3.0-only"
repository = "https://github.com/blueswansconsulting/open-quote"
rust-version = "1.88"
readme = "README.md"
keywords = ["quote", "pdf", "invoice", "self-hosted", "trades"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
