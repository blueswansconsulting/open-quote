name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Open Quote is deliberately small. Invoicing, payments, job management and certificates are out of scope."
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation on the job where you hit this.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
